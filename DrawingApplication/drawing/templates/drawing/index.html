{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Drawing Application</title>

    <link rel="stylesheet" href="{% static 'drawing/style.css' %}">
</head>

<body>

    <div class="container">

        <h1>Drawing Application</h1>

        <p>Welcome to our Drawing Application!</p>

        <div class="toolbar">

            <label for="shape">Select Shape:</label>

            <select id="shape">
                <option value="freehand">Freehand</option>
                <option value="line">Line</option>
                <option value="rectangle">Rectangle</option>
                <option value="circle">Circle</option>
            </select>

            <label for="color">Drawing Color:</label>
            <input type="color" id="color" value="#000000">

            <label for="width">Line Width:</label>
            <input type="range" id="width"
                   min="1" max="20" value="3">

            <button id="eraser">Eraser</button>

            <button id="clear">Clear Canvas</button>

        </div>

        <canvas id="drawingCanvas"
                width="900"
                height="500">
        </canvas>

    </div>

    <script src="{% static 'drawing/script.js' %}"></script>

</body>
</html>
